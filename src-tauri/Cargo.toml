[package]
name = "keyvault"
version = "0.1.0"
description = "本地加密 API key 收纳工具"
authors = ["michael"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "keyvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (D2): Argon2id KDF + AES-256-GCM, RustCrypto crates. Never hand-rolled.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hex = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
