[package]
name = "keyvault"
version = "0.3.0"
description = "本地、无密码的 API key 收纳工具（明文 JSON，拷贝文件夹即迁移）"
authors = ["michael"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "keyvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
